# ─────────────────────────────────────────────────────────────────────────────
# 20260930 最强之舟 · H5 三连夜战练级 (A → C → D)
# ─────────────────────────────────────────────────────────────────────────────
# 困难 H5 连续打 A、C、D 三个夜战点练级 (社区俗称"最强之舟"三连)。
#  · 本期活动 (event 20260930) 不使用 1a/1b 入口；H5 三点均为 轻母Ξ级IV型×3，
#    无门神、免驻防、免带路。
#  · 夜战时段对面不还手，己方零战损，故无需索敌撤退 / 修船 / 停止前进等防御逻辑。
# 出击前请确认: 舰队已编组、弹药/油充足、第 1 舰队 (fleet_id=1) 具备夜战能力。
# ─────────────────────────────────────────────────────────────────────────────

event: "20260930"      # 当前活动代号 → 定位活动地图节点数据
chapter: H             # H = 困难；E = 简单。仅 E/H 会被识别为活动战
map: 5                 # H5
fleet_id: 1            # 出征舰队 = 第 1 队

# 只打 A / C / D 三个点，白名单外的节点一律不前进
selected_nodes: [A, C, D]


# 三个点共用一套打法
node_defaults:
  formation: 4         # 4=梯形阵
  night: True          # 追击夜战：经验收益更高 (三连夜战练级关键)
  proceed: True        # 默认前进

# 逐节点前进路由: A → C → D → 回港
node_args:
  A:
    proceed: True      # A 打完前进 → C
  C:
    proceed: True      # C 打完前进 → D
  D:
    proceed: False     # D 打完回港，收工
